# Dokploy: create a "Docker Compose" service pointing at this repo, set
# NEXT_PUBLIC_SITE_URL in the Environment tab, then add your domain in the
# Domains tab (service: web, port: 3000). Dokploy's Traefik routes traffic
# over the shared dokploy-network, so no host ports are published here.
#
# Running locally instead? Create the network once:
#   docker network create dokploy-network
# then: docker compose up --build  (and open http://localhost:3000 via `ports` below)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    expose:
      - "3000"
    # ports:
    #   - "3000:3000"
    volumes:
      # Keeps optimised images and fetched data between restarts and redeploys.
      - next-cache:/app/.next/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/robots.txt > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - dokploy-network

volumes:
  next-cache:

networks:
  dokploy-network:
    external: true
